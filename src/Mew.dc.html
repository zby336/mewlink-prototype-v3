<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ size }}" height="{{ size }}" viewBox="18 10 100 100" style="display:block;overflow:visible">
  <defs><filter id="mewRough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"></feDisplacementMap></filter></defs>
  <ellipse cx="54" cy="106" rx="24" ry="3" fill="#EDE3D1"></ellipse>
  <g filter="url(#mewRough)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 101 C88 105 100 96 98 74" fill="none" stroke="#4A382B" stroke-width="7.4"></path>
    <path d="M70 101 C88 105 100 96 98 74" fill="none" stroke="#FFF9EC" stroke-width="3.6"></path>
    <rect x="82" y="50" width="32" height="25" rx="11" fill="#FFF9EC" stroke="#4A382B" stroke-width="2.2"></rect>
    <path d="M38 104 C30 104 28 92 31 80 C34 68 38 62 40 56 C34 50 32 42 34 34 L33 18 L45 27 C50 25 56 25 61 27 L72 17 L72 34 C75 42 73 50 67 56 C70 62 74 70 76 82 C78 94 75 104 67 104 Z" fill="#FFF9EC" stroke="#4A382B" stroke-width="2.2"></path>
    <path d="M61 27 L72 17 L72 34 C69 30 65 28 61 27 Z" fill="#EFA673" stroke="#4A382B" stroke-width="2.2"></path>
    <path d="M45 96 C48 100 52 100 54 96" fill="none" stroke="#4A382B" stroke-width="1.8" opacity="0.6"></path>
    <ellipse cx="28" cy="62" rx="5.5" ry="6.5" fill="#FFF9EC" stroke="#4A382B" stroke-width="2.2" opacity="{{ waveOp }}"></ellipse>
    <path d="M33 72 C30 68 28 66 28 68" fill="none" stroke="#4A382B" stroke-width="2.2" opacity="{{ waveOp }}"></path>
    <ellipse cx="57" cy="58" rx="5.5" ry="4.5" fill="#FFF9EC" stroke="#4A382B" stroke-width="2.2" opacity="{{ chinOp }}"></ellipse>
    <path d="M42 35.5 L48.5 33.5 M57.5 33.5 L64 35.5" fill="none" stroke="#4A382B" stroke-width="1.8" opacity="{{ browOp }}"></path>
    <ellipse cx="{{ ex1 }}" cy="{{ ey }}" rx="2.2" ry="2.9" fill="#3A2B21"></ellipse>
    <ellipse cx="{{ ex2 }}" cy="{{ ey }}" rx="2.2" ry="2.9" fill="#3A2B21"></ellipse>
    <path d="M51.6 44.6 L54.4 44.6 L53 46.2 Z" fill="#3A2B21" stroke="#3A2B21" stroke-width="1"></path>
    <path d="{{ mouth }}" fill="none" stroke="#3A2B21" stroke-width="1.7"></path>
  </g>
  <text x="98" y="66.5" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="600" fill="#4A382B" opacity="{{ hiOp }}">hi</text>
  <g fill="#4A382B" opacity="{{ dotsOp }}"><circle cx="91.5" cy="62.5" r="1.9"></circle><circle cx="98" cy="62.5" r="1.9"></circle><circle cx="104.5" cy="62.5" r="1.9"></circle></g>
  <g fill="none" stroke="#4A382B" stroke-width="1.7" stroke-linecap="round" opacity="{{ docOp }}"><rect x="92" y="55" width="12" height="15" rx="2" fill="#F4E6C3"></rect><path d="M95 60 H101 M95 63.5 H101 M95 67 H99"></path></g>
  <text x="98" y="68" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="16" font-weight="600" fill="#4A382B" opacity="{{ askOp }}">?</text>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hello&quot;,&quot;thinking&quot;,&quot;source&quot;,&quot;unsure&quot;],&quot;default&quot;:&quot;hello&quot;,&quot;tsType&quot;:&quot;'hello'|'thinking'|'source'|'unsure'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;min&quot;:24,&quot;max&quot;:240,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'hello';
    const m = {
      hello:    { ex1: 46, ex2: 60, ey: 39.5, mouth: 'M49 48.5 Q51 51 53 48.5 Q55 51 57 48.5' },
      thinking: { ex1: 47.5, ex2: 61.5, ey: 37.5, mouth: 'M50.5 49.5 L55.5 49.5' },
      source:   { ex1: 48, ex2: 62, ey: 39.5, mouth: 'M50 48.5 Q53 51.5 56 48.5' },
      unsure:   { ex1: 46, ex2: 60, ey: 40, mouth: 'M49 50 Q51 48 53 50 Q55 52 57 50' },
    }[mood] || {};
    const on = k => (mood === k ? 1 : 0);
    return { ...m, size: this.props.size ?? 96,
      waveOp: on('hello'), hiOp: on('hello'), chinOp: on('thinking'), dotsOp: on('thinking'),
      docOp: on('source'), browOp: on('unsure'), askOp: on('unsure') };
  }
}
</script>
</body>
</html>
